<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="EduBrain AI - 智能题库系统，支持外部题库与AI双重保障"
        />
        <meta name="keywords" content="AI, 题库, 智能问答, 教育, 人工智能" />
        <title>EduBrain AI - 智能题库系统</title>
        <link rel="stylesheet" href="/static/style.css?v=3" />
        <link
            href="https://cdn.staticfile.net/font-awesome/6.5.1/css/all.min.css"
            rel="stylesheet"
        />
        <style>
            /* 重置 body 样式 */
            body {
                display: block !important;
                flex-direction: unset !important;
            }
            
            /* 首页专属样式增强 */
            .index-container {
                min-height: 100vh;
                width: 100%;
                background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding: 40px 20px;
                position: relative;
                overflow: hidden;
            }
            
            /* 动态背景粒子效果 */
            .index-container::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: 
                    radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 40% 40%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
                animation: backgroundPulse 8s ease-in-out infinite;
                pointer-events: none;
            }
            
            @keyframes backgroundPulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.8; transform: scale(1.05); }
            }
            
            .header {
                text-align: center;
                margin-bottom: 40px;
                position: relative;
                z-index: 1;
            }
            
            .logo {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 16px;
                margin-bottom: 16px;
            }
            
            .logo i {
                font-size: 3rem;
                background: linear-gradient(135deg, #3b82f6, #8b5cf6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                animation: brainPulse 2s ease-in-out infinite;
                filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
            }
            
            @keyframes brainPulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.1); }
            }
            
            .logo h1 {
                font-size: 2.5rem;
                font-weight: 700;
                background: linear-gradient(135deg, #f1f5f9, #94a3b8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin: 0;
            }
            
            .subtitle {
                font-size: 1.1rem;
                color: #94a3b8;
                margin: 0 0 20px 0;
            }
            
            .integration-notice {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: rgba(59, 130, 246, 0.1);
                border: 1px solid rgba(59, 130, 246, 0.2);
                border-radius: 30px;
                padding: 10px 20px;
                color: #94a3b8;
                font-size: 0.9rem;
                transition: all 0.3s ease;
            }
            
            .integration-notice:hover {
                background: rgba(59, 130, 246, 0.15);
                border-color: rgba(59, 130, 246, 0.4);
                transform: translateY(-2px);
            }
            
            .integration-notice i {
                color: #3b82f6;
            }
            
            .notice-link {
                color: #3b82f6;
                text-decoration: none;
                font-weight: 500;
                transition: color 0.2s;
            }
            
            .notice-link:hover {
                color: #60a5fa;
                text-decoration: underline;
            }
            
            .main-content {
                width: 100%;
                max-width: 700px;
                position: relative;
                z-index: 1;
            }
            
            .search-card {
                background: rgba(30, 41, 59, 0.8);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 24px;
                padding: 32px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
                transition: all 0.3s ease;
            }
            
            .search-card:hover {
                border-color: rgba(255, 255, 255, 0.15);
                box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            }
            
            .card-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 24px;
            }
            
            .card-header i {
                font-size: 1.5rem;
                color: #3b82f6;
            }
            
            .card-header h2 {
                font-size: 1.4rem;
                color: #f1f5f9;
                margin: 0;
                font-weight: 600;
            }
            
            .feature-notice {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                background: rgba(139, 92, 246, 0.1);
                border: 1px solid rgba(139, 92, 246, 0.2);
                border-radius: 12px;
                padding: 14px 18px;
                margin-bottom: 24px;
            }
            
            .feature-notice i {
                color: #a78bfa;
                font-size: 1.1rem;
                margin-top: 2px;
            }
            
            .notice-content {
                color: #cbd5e1;
                font-size: 0.9rem;
                line-height: 1.5;
            }
            
            .notice-content code {
                background: rgba(0, 0, 0, 0.3);
                padding: 2px 8px;
                border-radius: 4px;
                font-family: 'JetBrains Mono', monospace;
                color: #a78bfa;
            }
            
            .search-form {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
            
            .form-row:first-child {
                grid-template-columns: 1fr;
            }
            
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            
            .form-group.full-width {
                grid-column: 1 / -1;
            }
            
            .form-group label {
                display: flex;
                align-items: center;
                gap: 8px;
                color: #94a3b8;
                font-size: 0.9rem;
                font-weight: 500;
            }
            
            .form-group label i {
                color: #64748b;
                font-size: 0.85rem;
            }
            
            .form-group textarea,
            .form-group select {
                background: rgba(15, 23, 42, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                padding: 14px 16px;
                color: #f1f5f9;
                font-size: 0.95rem;
                font-family: inherit;
                resize: vertical;
                transition: all 0.3s ease;
            }
            
            .form-group textarea:focus,
            .form-group select:focus {
                outline: none;
                border-color: rgba(59, 130, 246, 0.5);
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            }
            
            .form-group textarea::placeholder {
                color: #64748b;
            }
            
            .form-group select {
                cursor: pointer;
            }
            
            .form-group select option {
                background: #1e293b;
                color: #f1f5f9;
            }
            
            .character-counter {
                text-align: right;
                font-size: 0.75rem;
                color: #64748b;
                transition: color 0.2s;
            }
            
            .character-counter.warning {
                color: #f59e0b;
            }
            
            .character-counter.error {
                color: #ef4444;
            }
            
            .btn-primary {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                background: linear-gradient(135deg, #3b82f6, #2563eb);
                color: white;
                border: none;
                border-radius: 14px;
                padding: 16px 32px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            }
            
            .btn-primary:active {
                transform: translateY(0);
            }
            
            .btn-primary:disabled {
                opacity: 0.7;
                cursor: not-allowed;
                transform: none;
            }
            
            .result-card {
                margin-top: 24px;
                background: rgba(30, 41, 59, 0.8);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 20px;
                padding: 24px;
                animation: slideUp 0.4s ease;
            }
            
            .result-card.success {
                border-color: rgba(16, 185, 129, 0.3);
            }
            
            .result-card.error {
                border-color: rgba(239, 68, 68, 0.3);
            }
            
            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            .result-card .card-header i {
                color: #10b981;
            }
            
            .result-card.error .card-header i {
                color: #ef4444;
            }
            
            .result-content {
                margin-top: 16px;
            }
            
            .success-result {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            
            .result-item {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            
            .result-item strong {
                color: #94a3b8;
                font-size: 0.85rem;
            }
            
            .result-item span {
                color: #f1f5f9;
                font-size: 1rem;
                line-height: 1.6;
            }
            
            .answer-highlight {
                background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
                padding: 12px 16px;
                border-radius: 10px;
                border-left: 4px solid #10b981;
                font-weight: 500;
            }
            
            .result-meta {
                padding-top: 12px;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
            }
            
            .result-meta small {
                color: #64748b;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            
            .error-result {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: 20px;
                text-align: center;
            }
            
            .error-result i {
                font-size: 2rem;
                color: #ef4444;
            }
            
            .error-result p {
                color: #fca5a5;
                margin: 0;
            }
            
            .loading-card {
                margin-top: 24px;
                background: rgba(30, 41, 59, 0.8);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 20px;
                padding: 40px;
            }
            
            .loading-spinner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 24px;
            }
            
            .loading-brain {
                position: relative;
                width: 80px;
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .loading-brain i {
                font-size: 2.5rem;
                color: #3b82f6;
                animation: brainThink 1s ease-in-out infinite;
            }
            
            @keyframes brainThink {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.1); opacity: 0.8; }
            }
            
            .brain-waves {
                position: absolute;
                width: 100%;
                height: 100%;
            }
            
            .wave {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                border: 2px solid rgba(59, 130, 246, 0.3);
                border-radius: 50%;
                animation: waveExpand 2s ease-out infinite;
            }
            
            .wave-1 { width: 60px; height: 60px; animation-delay: 0s; }
            .wave-2 { width: 80px; height: 80px; animation-delay: 0.5s; }
            .wave-3 { width: 100px; height: 100px; animation-delay: 1s; }
            
            @keyframes waveExpand {
                0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
                100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
            }
            
            .loading-content {
                text-align: center;
            }
            
            .loading-content h3 {
                color: #f1f5f9;
                margin: 0 0 20px 0;
                font-size: 1.2rem;
            }
            
            .loading-progress {
                width: 100%;
                max-width: 300px;
            }
            
            .progress-bar {
                height: 6px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 3px;
                overflow: hidden;
                margin-bottom: 12px;
            }
            
            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #3b82f6, #8b5cf6);
                border-radius: 3px;
                width: 0%;
                transition: width 0.3s ease;
            }
            
            .progress-text {
                color: #94a3b8;
                font-size: 0.85rem;
            }
            
            .loading-steps {
                display: flex;
                justify-content: center;
                gap: 32px;
                margin-top: 24px;
            }
            
            .step {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                color: #64748b;
                font-size: 0.8rem;
                transition: all 0.3s ease;
            }
            
            .step i {
                font-size: 1.2rem;
            }
            
            .step.active {
                color: #3b82f6;
            }
            
            .step.completed {
                color: #10b981;
            }
            
            .footer {
                margin-top: 40px;
                text-align: center;
                position: relative;
                z-index: 1;
            }
            
            .footer-links {
                display: flex;
                justify-content: center;
                gap: 24px;
                margin-bottom: 16px;
            }
            
            .footer-link {
                display: flex;
                align-items: center;
                gap: 8px;
                color: #94a3b8;
                text-decoration: none;
                font-size: 0.9rem;
                padding: 8px 16px;
                border-radius: 8px;
                transition: all 0.2s ease;
            }
            
            .footer-link:hover {
                color: #f1f5f9;
                background: rgba(255, 255, 255, 0.05);
            }
            
            .footer-text {
                color: #64748b;
                font-size: 0.8rem;
                margin: 0;
            }
            
            /* 响应式设计 */
            @media (max-width: 640px) {
                .form-row {
                    grid-template-columns: 1fr;
                }
                
                .logo h1 {
                    font-size: 1.8rem;
                }
                
                .logo i {
                    font-size: 2.2rem;
                }
                
                .search-card {
                    padding: 24px 20px;
                }
                
                .loading-steps {
                    gap: 20px;
                }
            }
        </style>
    </head>
    <body>
        <div class="index-container">
            <header class="header">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <h1>EduBrain AI</h1>
                </div>
                <p class="subtitle">智能题库系统 - 支持外部题库与AI双重保障</p>
                <div class="integration-notice">
                    <i class="fas fa-plug"></i>
                    <span
                        >可集成到OCS网课助手使用 -
                        <a href="/docs" class="notice-link"
                            >查看集成指南</a
                        ></span
                    >
                </div>
            </header>

            <main class="main-content">
                <div class="search-card">
                    <div class="card-header">
                        <i class="fas fa-search"></i>
                        <h2>智能问答</h2>
                    </div>

                    <div class="feature-notice">
                        <i class="fas fa-lightbulb"></i>
                        <div class="notice-content">
                            <strong>提示：</strong> 支持外部题库查询，可在
                            <code>external_databases.json</code>
                            中配置更多题库源
                        </div>
                    </div>

                    <form id="searchForm" class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="title">
                                    <i class="fas fa-question-circle"></i>
                                    题目内容
                                </label>
                                <textarea
                                    id="title"
                                    name="title"
                                    required
                                    placeholder="请输入题目内容..."
                                    rows="3"
                                    maxlength="1000"
                                ></textarea>
                                <div class="character-counter">
                                    <span id="titleCounter">0</span>/1000
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="type">
                                    <i class="fas fa-list"></i>
                                    题型
                                </label>
                                <select id="type" name="type">
                                    <option value="single">单选题</option>
                                    <option value="multiple">多选题</option>
                                    <option value="judgement">判断题</option>
                                    <option value="completion">填空题</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="options">
                                    <i class="fas fa-tasks"></i>
                                    选项内容
                                </label>
                                <textarea
                                    id="options"
                                    name="options"
                                    placeholder="请输入选项内容（可选）"
                                    rows="3"
                                    maxlength="500"
                                ></textarea>
                                <div class="character-counter">
                                    <span id="optionsCounter">0</span>/500
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="context">
                                    <i class="fas fa-file-alt"></i>
                                    上下文信息
                                </label>
                                <textarea
                                    id="context"
                                    name="context"
                                    placeholder="请输入上下文信息（可选）"
                                    rows="2"
                                    maxlength="300"
                                ></textarea>
                                <div class="character-counter">
                                    <span id="contextCounter">0</span>/300
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search"></i>
                            <span>搜索答案</span>
                        </button>
                    </form>
                </div>

                <div id="result" class="result-card" style="display: none">
                    <div class="card-header">
                        <i class="fas fa-check-circle"></i>
                        <h3>搜索结果</h3>
                    </div>
                    <div id="resultContent" class="result-content"></div>
                </div>

                <div id="loading" class="loading-card" style="display: none">
                    <div class="loading-spinner">
                        <div class="loading-brain">
                            <i class="fas fa-brain"></i>
                            <div class="brain-waves">
                                <div class="wave wave-1"></div>
                                <div class="wave wave-2"></div>
                                <div class="wave wave-3"></div>
                            </div>
                        </div>
                        <div class="loading-content">
                            <h3>AI 正在智能分析中...</h3>
                            <div class="loading-progress">
                                <div class="progress-bar">
                                    <div
                                        class="progress-fill"
                                        id="progressFill"
                                    ></div>
                                </div>
                                <div class="progress-text" id="progressText">
                                    正在处理您的请求...
                                </div>
                            </div>
                            <div class="loading-steps">
                                <div class="step active" id="step1">
                                    <i class="fas fa-search"></i>
                                    <span>分析题目</span>
                                </div>
                                <div class="step" id="step2">
                                    <i class="fas fa-brain"></i>
                                    <span>AI推理</span>
                                </div>
                                <div class="step" id="step3">
                                    <i class="fas fa-check-circle"></i>
                                    <span>生成答案</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="footer">
                <div class="footer-links">
                    <a href="/dashboard" class="footer-link">
                        <i class="fas fa-tachometer-alt"></i>
                        管理面板
                    </a>
                    <a href="/docs" class="footer-link">
                        <i class="fas fa-book"></i>
                        API文档
                    </a>
                </div>
                <p class="footer-text">© 2025 EduBrain AI - 智能题库系统</p>
            </footer>
        </div>

        <script>
            // 字符计数器功能
            function updateCounter(textareaId, counterId, maxLength) {
                const textarea = document.getElementById(textareaId)
                const counter = document.getElementById(counterId)
                const counterElement = counter.parentElement

                textarea.addEventListener('input', function () {
                    const count = this.value.length
                    counter.textContent = count

                    // 移除所有状态类
                    counterElement.classList.remove('warning', 'error')

                    // 添加适当的状态类
                    if (count > maxLength * 0.9) {
                        counterElement.classList.add('error')
                    } else if (count > maxLength * 0.7) {
                        counterElement.classList.add('warning')
                    }
                })
            }

            // 初始化字符计数器
            updateCounter('title', 'titleCounter', 1000)
            updateCounter('options', 'optionsCounter', 500)
            updateCounter('context', 'contextCounter', 300)

            // 加载进度管理函数
            function initializeLoadingProgress() {
                const progressFill = document.getElementById('progressFill')
                const progressText = document.getElementById('progressText')
                const steps = [
                    document.getElementById('step1'),
                    document.getElementById('step2'),
                    document.getElementById('step3'),
                ]

                let currentStep = 0
                let progress = 0

                // 重置所有步骤
                steps.forEach((step) =>
                    step.classList.remove('active', 'completed')
                )
                steps[0].classList.add('active')
                progressFill.style.width = '0%'
                progressText.textContent = '正在分析您的题目...'

                // 模拟进度更新
                const progressInterval = setInterval(() => {
                    progress += Math.random() * 15
                    if (progress > 100) progress = 100

                    progressFill.style.width = progress + '%'

                    // 更新步骤状态
                    if (progress > 30 && currentStep < 1) {
                        steps[0].classList.remove('active')
                        steps[0].classList.add('completed')
                        steps[1].classList.add('active')
                        progressText.textContent = 'AI正在深度推理...'
                        currentStep = 1
                    } else if (progress > 70 && currentStep < 2) {
                        steps[1].classList.remove('active')
                        steps[1].classList.add('completed')
                        steps[2].classList.add('active')
                        progressText.textContent = '正在生成最优答案...'
                        currentStep = 2
                    }

                    if (progress >= 100) {
                        clearInterval(progressInterval)
                        progressText.textContent = '即将完成...'
                    }
                }, 200)

                // 清理函数（在请求完成后调用）
                return () => clearInterval(progressInterval)
            }

            document
                .getElementById('searchForm')
                .addEventListener('submit', async function (e) {
                    e.preventDefault()

                    const formData = new FormData(this)
                    const data = Object.fromEntries(formData)

                    // 显示加载状态
                    document.getElementById('loading').style.display = 'block'
                    document.getElementById('result').style.display = 'none'

                    // 添加按钮加载状态
                    const submitBtn = this.querySelector('.btn-primary')
                    submitBtn.disabled = true
                    submitBtn.innerHTML =
                        '<i class="fas fa-spinner fa-spin"></i><span>搜索中...</span>'

                    // 初始化加载进度
                    initializeLoadingProgress()

                    try {
                        const response = await fetch('/api/search', {
                            method: 'POST',
                            headers: {
                                'Content-Type':
                                    'application/x-www-form-urlencoded',
                            },
                            body: new URLSearchParams(data),
                        })

                        const result = await response.json()
                        const resultDiv = document.getElementById('result')
                        const resultContent =
                            document.getElementById('resultContent')

                        if (result.code === 1) {
                            resultContent.innerHTML = `
                        <div class="success-result">
                            <div class="result-item">
                                <strong>题目：</strong>
                                <span>${result.question}</span>
                            </div>
                            <div class="result-item">
                                <strong>答案：</strong>
                                <span class="answer-highlight">${
                                    result.answer
                                }</span>
                            </div>
                            <div class="result-meta">
                                <small><i class="fas fa-clock"></i> 处理时间: ${
                                    result.processing_time || 'N/A'
                                }</small>
                            </div>
                        </div>
                    `
                            resultDiv.className = 'result-card success'
                        } else {
                            resultContent.innerHTML = `
                        <div class="error-result">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>${result.msg}</p>
                        </div>
                    `
                            resultDiv.className = 'result-card error'
                        }

                        resultDiv.style.display = 'block'
                    } catch (error) {
                        console.error('Error:', error)
                        const resultDiv = document.getElementById('result')
                        const resultContent =
                            document.getElementById('resultContent')
                        resultContent.innerHTML = `
                    <div class="error-result">
                        <i class="fas fa-times-circle"></i>
                        <p>网络错误，请检查连接后重试</p>
                    </div>
                `
                        resultDiv.className = 'result-card error'
                        resultDiv.style.display = 'block'
                    } finally {
                        document.getElementById('loading').style.display =
                            'none'
                        // 恢复按钮状态
                        submitBtn.disabled = false
                        submitBtn.innerHTML =
                            '<i class="fas fa-search"></i><span>搜索答案</span>'
                    }
                })
        </script>
    </body>
</html>
